# 新闻联播日报 · 云端执行（GitHub Actions）
# 每天 21:30-23:30（北京时间）多时段自动重试：首班 21:30 尝试央视 API（当日节目滞后约2-4小时），
# 若未拿到数据则不发信，后续班次自动重试；成功后写 marker 当天自动停止；23:30 末班仍无数据才发"缺失说明"。
#   采集（央视官方API + Bing）→ 形势检索 → DeepSeek API 分析（含逐条计算推演与判断）
#   → 生成 reports/YYYY-MM-DD.md → SMTP 推送
# 凭据全部通过 GitHub Secrets 加密注入（环境变量），不写入仓库。
name: daily-xinwenlianbo-report

on:
  schedule:
    - cron: "30 13 * * *"    # 21:30 北京（首班）
    - cron: "0 14 * * *"     # 22:00
    - cron: "30 14 * * *"    # 22:30
    - cron: "0 15 * * *"     # 23:00
    - cron: "30 15 * * *"    # 23:30（末班，仍缺则发缺失说明）
  workflow_dispatch:          # 手动触发（可指定补跑日期）
    inputs:
      date:
        description: "补跑日期 YYYY-MM-DD（留空=今天，北京时间）"
        required: false
        default: ""

permissions:
  contents: read              # 最小权限：只读代码，不写仓库

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai       # 保证脚本内 date.today() 为北京时间
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_AUTHCODE: ${{ secrets.SMTP_AUTHCODE }}
          SMTP_RECIPIENT: ${{ secrets.SMTP_RECIPIENT }}
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_SSL: "true"
          INPUT_DATE: ${{ inputs.date }}
        run: |
          echo "=== 凭据注入检查（只显示是否注入，不显示值）==="
          MISSING=""
          for v in DEEPSEEK_API_KEY SMTP_SENDER SMTP_AUTHCODE SMTP_RECIPIENT; do
            if [ -n "${!v}" ]; then echo "$v: OK(set)"; else echo "$v: MISSING"; MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::以下 Secrets 未注入运行器：$MISSING —— 请检查仓库 Settings → Secrets and variables → Actions 的 Repository secrets（不是 Environments/Codespaces），名称须完全一致：DEEPSEEK_API_KEY / SMTP_SENDER / SMTP_AUTHCODE / SMTP_RECIPIENT"
            exit 1
          fi
          ARGS=""
          if [ -n "$INPUT_DATE" ]; then ARGS="--date $INPUT_DATE"; fi
          python scripts/standalone_report.py $ARGS

      - name: Upload report + logs (optional)
        uses: actions/upload-artifact@v4
        with:
          name: xinwenlianbo-report
          path: |
            reports/*.md
            logs/*.log
          if-no-files-found: ignore
